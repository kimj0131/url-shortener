<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>관리자 로그인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            background: white;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h3 class="text-center mb-4">🔒 관리자 로그인</h3>

    <!-- 에러 메시지 -->
    <div th:if="${param.error}" class="alert alert-danger text-center">
        아이디 또는 비밀번호가 올바르지 않습니다.
    </div>

    <!-- 로그아웃 메시지 -->
    <div th:if="${param.logout}" class="alert alert-success text-center">
        로그아웃 되었습니다.
    </div>

    <form th:action="@{/admin/login}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label">아이디</label>
            <input type="text" class="form-control" id="username" name="username" placeholder="admin" required autofocus>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">비밀번호</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="1234" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">로그인</button>
    </form>

    <hr class="my-4">

    <div class="text-center text-muted small">
        <p class="mb-1"><strong>[체험용 계정]</strong></p>
        <p>ID: <code>admin</code> / PW: <code>1234</code></p>
    </div>
</div>

</body>
</html>
