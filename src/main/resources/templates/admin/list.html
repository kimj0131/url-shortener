<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>URL 관리자</title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>🔗 URL 관리 대시보드</h2>

    <table class="table table-hover">
        <thead>
        <tr>
            <th>ID</th>
            <th>Short ID</th>
            <th>Original URL</th>
            <th>방문 수</th>
            <th>생성일</th>
            <th>관리</th>
        </tr>
        </thead>
        <tbody>

        <tr th:if="${urls.isEmpty()}">
            <td colspan="5" class="text-center">데이터가 없습니다.</td>
        </tr>

        <tr th:each="u : ${urls}">
            <td th:text="${u.id}">1</td>

            <td th:text="${u.shortId}">abc12</td>

            <td th:text="${u.originalUrl}">https://...</td>

            <td th:text="${u.visitCount}">0</td>

            <td th:text="${#temporals.format(u.createdAt, 'yyyy-MM-dd')}">2024-01-01</td>

            <td>
                <form th:action="@{/admin/{id}/delete(id=${u.id})}" method="post"
                      onsubmit="return confirm('정말 삭제하시겠습니까?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">삭제</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- 페이징 버튼 -->
    <div class="d-flex justify-content-center">
        <a class="btn btn-outline-primary me-2"
           th:if="${!urls.first}"
           th:href="@{/admin(page=${urls.number - 1})}">이전</a>

        <a class="btn btn-outline-primary"
           th:if="${!urls.last}"
           th:href="@{/admin(page=${urls.number + 1})}">다음</a>
    </div>
</div>
</body>
</html>
