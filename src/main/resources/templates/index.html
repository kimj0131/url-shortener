<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>URL Shortener</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts (Noto Sans KR) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        .btn-primary {
            background-color: #4e73df;
            border-color: #4e73df;
            padding: 10px 20px;
            font-weight: bold;
        }
        .btn-primary:hover {
            background-color: #2e59d9;
            border-color: #2653d4;
        }
        .result-box {
            background-color: #e8f0fe;
            border: 1px solid #b3d7ff;
            color: #004085;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card p-5">
                <div class="text-center mb-4">
                    <h1 class="fw-bold text-primary">🔗 URL Shortener</h1>
                    <p class="text-muted">긴 주소를 짧고 간편하게 줄여보세요!</p>
                </div>

                <!-- 입력 폼 -->
                <form action="/shorten" method="post" th:object="${createUrlDto}">
                    <div class="mb-3">
                        <label for="originalUrl" class="form-label visually-hidden">Original URL</label>
                        <input type="text" class="form-control form-control-lg"
                               id="originalUrl" name="originalUrl"
                               th:classappend="${#fields.hasErrors('originalUrl')} ? 'is-invalid' : ''"
                               placeholder="https://example.com/very/long/url..." required>

                        <!-- 에러 메시지 -->
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('originalUrl')}" th:errors="*{originalUrl}">
                            잘못된 URL입니다.
                        </div>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">단축하기</button>
                    </div>
                </form>

                <!-- 결과 표시 영역 (Thymeleaf) -->
                <div th:if="${shortUrl}" class="result-box">
                    <p class="mb-1">🎉 단축된 URL이 준비되었습니다!</p>
                    <a th:href="${shortUrl}" th:text="${shortUrl}" target="_blank" class="text-decoration-none fs-5"></a>
                </div>
            </div>

            <div class="text-center mt-3 text-muted">
                <small>&copy; 2025 URL Shortener Project</small>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
