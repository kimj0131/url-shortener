spring.application.name=urlshortener

# H2 Console 설정
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
spring.h2.console.settings.trace=false

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.hibernate.ddl-auto=update

spring.data.redis.host=localhost
spring.data.redis.port=6379

logging.level.org.springframework.cache=TRACE

# --- Kafka Configuration ---
# Kafka 서버 주소 (로컬 개발용)
spring.kafka.bootstrap-servers=localhost:9092

# Consumer Group ID (컨슈머들을 묶는 그룹 이름)
spring.kafka.consumer.group-id=url-shortener-group

# 데이터가 처음부터 없을 때 어디서부터 읽을지 (earliest: 처음부터, latest: 지금부터)
spring.kafka.consumer.auto-offset-reset=earliest

# 직렬화/역직렬화 설정 (Key는 문자열, Value는 JSON으로 주고받음)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# JSON 변환 시 신뢰할 패키지 설정 (보안 이슈 방지)
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# --- Actuator & Prometheus Configuration ---
# Actuator 엔드포인트 노출 설정 (Health Check, Info, Prometheus 메트릭)
management.endpoints.web.exposure.include=health,info,prometheus

# Health Check 시 상세 정보 표시 (DB, Disk Space 등 상태 확인용)
management.endpoint.health.show-details=always

# Prometheus 메트릭 수집 활성화
management.endpoint.prometheus.enabled=true

# 메트릭에 애플리케이션 이름 태그 추가 (Grafana에서 여러 앱 구분 시 유용)
management.metrics.tags.application=${spring.application.name}