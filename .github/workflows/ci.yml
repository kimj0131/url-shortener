name: Java CI with Gradle

# 1. Trigger
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# 2. Jobs
jobs:
  build:
    runs-on: ubuntu-latest # 리눅스 컴퓨터 한 대 빌려줘!

    # 3. Redis (Service Container)
    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379

    steps:
      # (1) 코드 가져오기
      - uses: actions/checkout@v3

      # (2) 자바 17 설치하기
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # (3) Gradle 권한 주기 (리눅스라 필요함)
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # (3.5) application.properties 생성
      - name: Create application.properties
        run: |
          mkdir -p src/main/resources
          echo "spring.datasource.url=jdbc:h2:mem:testdb" >> src/main/resources/application.properties
          echo "spring.datasource.driverClassName=org.h2.Driver" >> src/main/resources/application.properties
          echo "spring.datasource.username=sa" >> src/main/resources/application.properties
          echo "spring.jpa.database-platform=org.hibernate.dialect.H2Dialect" >> src/main/resources/application.properties
          echo "spring.data.redis.host=localhost" >> src/main/resources/application.properties
          echo "spring.data.redis.port=6379" >> src/main/resources/application.properties

      # (4) 빌드하고 테스트
      - name: Build with Gradle
        run: ./gradlew clean build

