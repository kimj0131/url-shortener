name: Java CI with Gradle

# 1. Trigger
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# 2. Jobs
jobs:
  build:
    runs-on: ubuntu-latest # 리눅스 컴퓨터 한 대 빌려줘!

    # 3. Services (Redis + Kafka + Zookeeper)
    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379

      # [추가] Zookeeper
      zookeeper:
        image: confluentinc/cp-zookeeper:7.5.0
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000
        ports:
          - 2181:2181

      # [추가] Kafka
      kafka:
        image: confluentinc/cp-kafka:7.5.0
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        ports:
          - 9092:9092

    steps:
      # (1) 코드 가져오기
      - uses: actions/checkout@v3

      # (2) 자바 17 설치하기
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # (3) Gradle 권한 주기 (리눅스라 필요함)
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # (3.5) application.properties 생성
      - name: Create application.properties
        run: |
          mkdir -p src/main/resources
          echo "spring.datasource.url=jdbc:h2:mem:testdb" >> src/main/resources/application.properties
          echo "spring.datasource.driverClassName=org.h2.Driver" >> src/main/resources/application.properties
          echo "spring.datasource.username=sa" >> src/main/resources/application.properties
          echo "spring.jpa.database-platform=org.hibernate.dialect.H2Dialect" >> src/main/resources/application.properties
          echo "spring.data.redis.host=localhost" >> src/main/resources/application.properties
          echo "spring.data.redis.port=6379" >> src/main/resources/application.properties
          
          # [추가] Kafka 설정
          echo "spring.kafka.bootstrap-servers=localhost:9092" >> src/main/resources/application.properties
          echo "spring.kafka.consumer.group-id=test-group" >> src/main/resources/application.properties
          echo "spring.kafka.consumer.auto-offset-reset=earliest" >> src/main/resources/application.properties
          echo "spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer" >> src/main/resources/application.properties
          echo "spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer" >> src/main/resources/application.properties
          echo "spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer" >> src/main/resources/application.properties
          echo "spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer" >> src/main/resources/application.properties
          echo "spring.kafka.consumer.properties.spring.json.trusted.packages=*" >> src/main/resources/application.properties

      # (4) 빌드하고 테스트
      - name: Build with Gradle
        run: ./gradlew clean build

